<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .form-container {
            background-color: maroon;
            width: 400px;
            padding:  10px;
            color: white;
            font-family: "Montserrat";
        }
        input,
        textarea,
        button {
            width: 90%
            margin-button: 10px;
        }
        input: focus,
        textarea {
            background-color: transparent;
            border: none;
            border-button: 2px solid white;
            color: white;
            font-family: "Lexend";
        }
        input[type="text"]:focus {
            background-color: rgb(211, 202, 202);
            color: black;
        }

        button {
            padding: 10px;
            font-size: 1em;
            font-family: "Lexend";
            font-weight: 700;
            background-color: greenyellow;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="form-container">
        <form>
            <label for="name">Enter Name:</label><br />
            <input type="text" /><br />

            <label for="phonenumber">Enter Phone Number:</label><br>
            <input type="number" /><br />

            <label for="email">Enter Email:</label><br />
            <input type="email"/><br />

            <label for="message">Write your message here:</label><br />
            <textarea cel="12" row="5"></textarea><br />

            <button type="submit">Submit</button><br />
        </form>
    </div>
</body>
</html>
