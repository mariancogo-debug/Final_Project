<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>

    <style>
        .container {
            padding: 1px;
            background-color: grey;
            width: 400px;
            height: 400px;
            display: grid;
            gap: 6px;
            grid-template-columns: auto auto auto;
            grid-template-rows: auto auto auto;
            grid-template-areas:
              "item1 item1 item1"
              "item2 item3 item3"
              "item2 item4 item5"
              "item2 item6 item6";
        }
        #item1 {
            border: 2px solid black;
            grid-area: item1;
            background-color: maroon;
        }
         #item2 {
            border: 2px solid black;
            grid-area: item2;
            background-color: orange;
        }
         #item3 {
            border: 2px solid black;
            grid-area: item3;
            background-color: pink;
        }
         #item4 {
            border: 2px solid black;
            grid-area: item4;
            background-color: navy;
        }
        #item5 {
            border: 2px solid black;
            grid-area: item5;
            background-color: purple;
        }
         #item6 {
            border: 2px solid black;
            grid-area: item6;
            background-color: rgb(194, 48, 227);
        }
    </style>
</head>
<body>
    <div class="container">
        <div id="item1">1</div>
        <div id="item2">2</div>
        <div id="item3">3</div>
        <div id="item4">4</div>
        <div id="item5">5</div>
        <div id="item6">6</div>
    </div>
</body>
</html>
